<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" fill="none" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="tpf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c0415"/>
      <stop offset="100%" stop-color="#4d0a26"/>
    </linearGradient>
    <linearGradient id="tpf-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b0b31"/>
      <stop offset="100%" stop-color="#560926"/>
    </linearGradient>
    <filter id="tpf-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tpf-win"><rect x="150" y="150" width="900" height="700" rx="22"/></clipPath>
  </defs>

  <rect width="1200" height="1000" fill="url(#tpf-bg)"/>
  <circle cx="1000" cy="180" r="260" fill="#ff4d8d" fill-opacity="0.07"/>
  <circle cx="200" cy="880" r="220" fill="#ff4d8d" fill-opacity="0.05"/>

  <!-- app window -->
  <g filter="url(#tpf-shadow)">
    <rect x="150" y="150" width="900" height="700" rx="22" fill="#faf8f2"/>
  </g>

  <g clip-path="url(#tpf-win)">
    <!-- sidebar -->
    <rect x="150" y="150" width="262" height="700" fill="url(#tpf-side)"/>

    <text x="186" y="232" font-size="33" font-weight="800" fill="#ffffff" letter-spacing="0.5">THE</text>
    <text x="186" y="272" font-size="33" font-weight="800" fill="#ffffff" letter-spacing="0.5">PRODUCT</text>
    <text x="186" y="312" font-size="33" font-weight="800" fill="#ffffff" letter-spacing="0.5">FOLKS</text>
    <path d="M330 288 l16 -10 l-4 12 l12 -2 l-18 12 l4 -12 z" fill="#ffffff" fill-opacity="0.9"/>
    <text x="186" y="346" font-size="15" fill="#ffffff" fill-opacity="0.55">Profile Matcher</text>

    <rect x="168" y="392" width="226" height="42" rx="10" fill="#ffffff" fill-opacity="0.14"/>
    <circle cx="196" cy="413" r="7" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2"/>
    <path d="M201 418 l6 6" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round"/>
    <text x="220" y="419" font-size="17" fill="#ffffff">JD Search</text>

    <rect x="189" y="455" width="14" height="14" rx="3" fill="#ffffff" fill-opacity="0.5"/>
    <text x="220" y="468" font-size="17" fill="#ffffff" fill-opacity="0.65">Browse Profiles</text>

    <circle cx="196" cy="510" r="7" fill="#ffffff" fill-opacity="0.5"/>
    <text x="220" y="517" font-size="17" fill="#ffffff" fill-opacity="0.65">Settings</text>

    <rect x="150" y="778" width="262" height="1" fill="#ffffff" fill-opacity="0.16"/>
    <text x="186" y="816" font-size="16" fill="#ffffff" fill-opacity="0.6">23,075 profiles indexed</text>

    <!-- main panel -->
    <text x="452" y="224" font-size="31" font-weight="700" fill="#1c1b1a">JD Search</text>
    <text x="452" y="256" font-size="16" fill="#8a8580">Upload a job description to find ranked candidates</text>

    <rect x="452" y="284" width="126" height="38" rx="9" fill="#ffffff" stroke="#e2ddd3"/>
    <rect x="470" y="297" width="13" height="15" rx="2" fill="none" stroke="#5c5852" stroke-width="1.6"/>
    <text x="494" y="309" font-size="15" fill="#3d3a36">Upload JD</text>

    <rect x="592" y="284" width="100" height="38" rx="9" fill="#ffffff" stroke="#e2ddd3"/>
    <g stroke="#5c5852" stroke-width="1.6" stroke-linecap="round">
      <path d="M610 299h14M610 305h10M610 311h6"/>
    </g>
    <text x="632" y="309" font-size="15" fill="#3d3a36">Filters</text>

    <rect x="452" y="340" width="546" height="92" rx="10" fill="#ffffff" stroke="#e2ddd3"/>
    <text x="472" y="372" font-size="16" fill="#b3ada4">Paste the job description here...</text>

    <rect x="452" y="452" width="178" height="44" rx="10" fill="#6b0b31"/>
    <circle cx="480" cy="474" r="6.5" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M485 479 l6 6" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="500" y="480" font-size="16" font-weight="600" fill="#ffffff">Find Candidates</text>

    <text x="452" y="546" font-size="13" fill="#8a8580" letter-spacing="2.5">TOP MATCHES</text>

    <g>
      <rect x="452" y="562" width="546" height="56" rx="12" fill="#ffffff" stroke="#efd9e2"/>
      <circle cx="486" cy="590" r="16" fill="#6b0b31" fill-opacity="0.12"/>
      <rect x="516" y="578" width="150" height="10" rx="5" fill="#3d3a36" fill-opacity="0.75"/>
      <rect x="516" y="596" width="230" height="8" rx="4" fill="#8a8580" fill-opacity="0.5"/>
      <rect x="890" y="578" width="86" height="26" rx="13" fill="#6b0b31"/>
      <text x="933" y="596" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">0.94</text>
    </g>
    <g>
      <rect x="452" y="630" width="546" height="56" rx="12" fill="#ffffff" stroke="#eee8e0"/>
      <circle cx="486" cy="658" r="16" fill="#6b0b31" fill-opacity="0.08"/>
      <rect x="516" y="646" width="124" height="10" rx="5" fill="#3d3a36" fill-opacity="0.6"/>
      <rect x="516" y="664" width="196" height="8" rx="4" fill="#8a8580" fill-opacity="0.4"/>
      <rect x="890" y="646" width="86" height="26" rx="13" fill="#6b0b31" fill-opacity="0.55"/>
      <text x="933" y="664" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">0.88</text>
    </g>
    <g>
      <rect x="452" y="698" width="546" height="56" rx="12" fill="#ffffff" stroke="#eee8e0"/>
      <circle cx="486" cy="726" r="16" fill="#6b0b31" fill-opacity="0.06"/>
      <rect x="516" y="714" width="104" height="10" rx="5" fill="#3d3a36" fill-opacity="0.45"/>
      <rect x="516" y="732" width="168" height="8" rx="4" fill="#8a8580" fill-opacity="0.3"/>
      <rect x="890" y="714" width="86" height="26" rx="13" fill="#6b0b31" fill-opacity="0.3"/>
      <text x="933" y="732" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">0.81</text>
    </g>

    <text x="452" y="800" font-size="15" fill="#8a8580">Ranked in seconds from 23,075 indexed profiles</text>
  </g>
</svg>
