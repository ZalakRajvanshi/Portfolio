<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" fill="none" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="wa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04322d"/>
      <stop offset="100%" stop-color="#0a6b5c"/>
    </linearGradient>
    <filter id="wa-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="wa-win"><rect x="150" y="150" width="900" height="700" rx="22"/></clipPath>
  </defs>

  <rect width="1200" height="1000" fill="url(#wa-bg)"/>
  <circle cx="1030" cy="150" r="240" fill="#25d366" fill-opacity="0.09"/>
  <circle cx="170" cy="900" r="200" fill="#25d366" fill-opacity="0.07"/>

  <g filter="url(#wa-shadow)">
    <rect x="150" y="150" width="900" height="700" rx="22" fill="#ece5dd"/>
  </g>

  <g clip-path="url(#wa-win)">
    <!-- chat header -->
    <rect x="150" y="150" width="900" height="72" fill="#075e54"/>
    <circle cx="200" cy="186" r="21" fill="#25d366" fill-opacity="0.85"/>
    <path d="M200 178a7 7 0 1 1 0 14 7 7 0 0 1 0-14zM188 200c3-5 21-5 24 0" fill="#075e54" fill-opacity="0.55"/>
    <rect x="236" y="172" width="132" height="11" rx="5.5" fill="#ffffff" fill-opacity="0.9"/>
    <text x="236" y="205" font-size="14" fill="#ffffff" fill-opacity="0.6">candidate</text>
    <rect x="876" y="170" width="132" height="32" rx="16" fill="#25d366" fill-opacity="0.22"/>
    <circle cx="900" cy="186" r="5" fill="#25d366"/>
    <text x="916" y="192" font-size="14" font-weight="600" fill="#d6ffe8">automated</text>

    <!-- touch 1 -->
    <text x="990" y="262" font-size="12" fill="#7d8d88" text-anchor="end" letter-spacing="2">TOUCH 1</text>
    <path d="M556 276h414a16 16 0 0 1 16 16v56a16 16 0 0 1-16 16H572l-16 18z" fill="#dcf8c6"/>
    <rect x="580" y="300" width="330" height="10" rx="5" fill="#3b4a44" fill-opacity="0.55"/>
    <rect x="580" y="322" width="228" height="10" rx="5" fill="#3b4a44" fill-opacity="0.32"/>
    <g stroke="#34b7f1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M934 346l6 7 13-15"/>
      <path d="M948 346l6 7 13-15"/>
    </g>

    <!-- wait marker -->
    <g>
      <path d="M470 392h230M760 392h230" stroke="#c9c0b6" stroke-width="1.5"/>
      <text x="730" y="398" font-size="14" fill="#8b8378" text-anchor="middle">36h later</text>
    </g>

    <!-- touch 2 -->
    <path d="M556 424h414a16 16 0 0 1 16 16v56a16 16 0 0 1-16 16H572l-16 18z" fill="#dcf8c6"/>
    <rect x="580" y="448" width="286" height="10" rx="5" fill="#3b4a44" fill-opacity="0.5"/>
    <rect x="580" y="470" width="198" height="10" rx="5" fill="#3b4a44" fill-opacity="0.28"/>
    <g stroke="#34b7f1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M934 494l6 7 13-15"/>
      <path d="M948 494l6 7 13-15"/>
    </g>

    <!-- wait marker -->
    <g>
      <path d="M470 540h230M760 540h230" stroke="#c9c0b6" stroke-width="1.5"/>
      <text x="730" y="546" font-size="14" fill="#8b8378" text-anchor="middle">36h later</text>
    </g>

    <!-- touch 3 -->
    <text x="990" y="586" font-size="12" fill="#7d8d88" text-anchor="end" letter-spacing="2">TOUCH 3</text>
    <path d="M556 600h414a16 16 0 0 1 16 16v40a16 16 0 0 1-16 16H572l-16 18z" fill="#dcf8c6"/>
    <rect x="580" y="624" width="252" height="10" rx="5" fill="#3b4a44" fill-opacity="0.45"/>
    <g stroke="#34b7f1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M934 654l6 7 13-15"/>
      <path d="M948 654l6 7 13-15"/>
    </g>

    <!-- inbound reply + classification -->
    <path d="M644 700H230a16 16 0 0 0-16 16v40a16 16 0 0 0 16 16h398l16 18z" fill="#ffffff"/>
    <rect x="246" y="724" width="228" height="10" rx="5" fill="#3b4a44" fill-opacity="0.5"/>
    <rect x="246" y="746" width="150" height="10" rx="5" fill="#3b4a44" fill-opacity="0.28"/>

    <rect x="214" y="796" width="150" height="34" rx="17" fill="#25d366" fill-opacity="0.2" stroke="#1eaa55" stroke-opacity="0.5"/>
    <circle cx="238" cy="813" r="5" fill="#1eaa55"/>
    <text x="254" y="819" font-size="15" font-weight="600" fill="#12704a">positive</text>
    <text x="384" y="819" font-size="15" fill="#7d8d88">classified, logged to Sheets</text>
  </g>
</svg>
